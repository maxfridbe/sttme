name: Build & Release Binaries

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Release versions follow vYY.MMDD.## (e.g. v26.1029.01); untagged builds report dev-<sha>.
  STTME_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('dev-{0}', github.sha) }}

jobs:
  check:
    name: Lint, Test & ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release tag format (vYY.MMDD.##)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]{2}\.[0-9]{4}\.[0-9]{2}$ ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} must match vYY.MMDD.## (e.g. v26.1029.01)"
            exit 1
          fi

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            clang \
            libclang-dev \
            pkg-config \
            libasound2-dev \
            x11-xkb-utils \
            xkb-data \
            shellcheck

      - name: Validate Linux install scripts with ShellCheck
        run: |
          shellcheck install.sh uninstall.sh packaging/windows/build-installer.sh
          bash -n install.sh uninstall.sh packaging/windows/build-installer.sh

      - name: Validate Windows PowerShell installer syntax
        shell: pwsh
        run: |
          foreach ($script in @("install.ps1", "uninstall.ps1")) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$null,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.ToString() }
              throw "PowerShell syntax error in $script"
            }
          }

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: |
          if ! cargo clippy --all-targets --locked -- -D warnings 2>&1 | tee clippy.log; then
            echo "### Clippy Failure" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat clippy.log | head -n 60 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Run Windows Clippy lints (cross-target)
        run: |
          rustup target add x86_64-pc-windows-gnu
          if ! cargo clippy --target x86_64-pc-windows-gnu --bins --tests --locked -- -D warnings 2>&1 | tee clippy-windows.log; then
            echo "### Windows Clippy Failure" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat clippy-windows.log | head -n 60 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Run unit tests
        run: |
          if ! cargo test --locked 2>&1 | tee test.log; then
            echo "### Test Failure" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat test.log | head -n 60 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  build-linux:
    name: Build Linux (${{ matrix.arch }})
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            ggml_x86: "ON"
          - arch: aarch64
            runner: ubuntu-24.04-arm
            ggml_x86: "OFF"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            clang \
            libclang-dev \
            pkg-config \
            libasound2-dev

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and release target
        uses: Swatinem/rust-cache@v2
        with:
          key: release-linux-${{ matrix.arch }}

      - name: Build optimized release binary
        env:
          # whisper-rs-sys forwards every GGML_* env var as a CMake define.
          # GGML_NATIVE=OFF keeps the binary portable across x86 CPUs.
          GGML_NATIVE: "OFF"
          GGML_AVX: ${{ matrix.ggml_x86 }}
          GGML_AVX2: ${{ matrix.ggml_x86 }}
          GGML_FMA: ${{ matrix.ggml_x86 }}
          GGML_F16C: ${{ matrix.ggml_x86 }}
        run: cargo build --release --locked

      - name: Smoke-test compiled binary
        run: |
          ./target/release/sttme --version
          ./target/release/sttme --help >/dev/null
          ldd ./target/release/sttme

      - name: Package release archive and SHA-256 checksum
        run: |
          STAGE_DIR="dist/sttme-linux-${{ matrix.arch }}"
          ARCHIVE="dist/sttme-linux-${{ matrix.arch }}.tar.gz"
          mkdir -p "${STAGE_DIR}"
          install -Dm0755 target/release/sttme "${STAGE_DIR}/sttme"
          install -Dm0755 install.sh "${STAGE_DIR}/install.sh"
          install -Dm0755 uninstall.sh "${STAGE_DIR}/uninstall.sh"
          install -Dm0644 README.md "${STAGE_DIR}/README.md"
          install -Dm0644 LICENSE "${STAGE_DIR}/LICENSE"
          tar -C "${STAGE_DIR}" -czf "${ARCHIVE}" \
            sttme install.sh uninstall.sh README.md LICENSE
          (
            cd dist
            sha256sum "sttme-linux-${{ matrix.arch }}.tar.gz" > "sttme-linux-${{ matrix.arch }}.tar.gz.sha256"
          )

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v4
        with:
          name: sttme-linux-${{ matrix.arch }}
          path: |
            dist/sttme-linux-${{ matrix.arch }}.tar.gz
            dist/sttme-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  build-windows:
    name: Build Windows Tray (x86_64)
    needs: check
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and Windows release target
        uses: Swatinem/rust-cache@v2
        with:
          key: release-windows-x86_64

      - name: Build optimized Windows System Tray binary
        shell: pwsh
        env:
          GGML_NATIVE: "OFF"
          GGML_AVX: "ON"
          GGML_AVX2: "ON"
          GGML_FMA: "ON"
          GGML_F16C: "ON"
        run: |
          cargo build --release --locked 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Windows Release Build Failure"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```text'
            Get-Content -Path build.log -Tail 150 | Add-Content -Path $env:GITHUB_STEP_SUMMARY
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
            exit 1
          }

      - name: Smoke-test Windows executable
        shell: pwsh
        run: |
          # sttme.exe is a GUI-subsystem tray app; piping forces PowerShell to wait and capture stdout.
          try {
            $ver = (& .\target\release\sttme.exe --version | Out-String).Trim()
            Write-Host "Reported version: $ver"
            if (-not $ver.Contains($env:STTME_VERSION)) { throw "Expected version $env:STTME_VERSION, got '$ver'" }
            $help = (& .\target\release\sttme.exe --help | Out-String)
            if (-not $help.Contains("tray")) { throw "Windows --help is missing the tray subcommand" }
            Get-Item .\target\release\sttme.exe | Select-Object Name, Length
          } catch {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Windows Smoke Test Failure"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```text'
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $_.Exception.ToString()
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
            throw
          }

      - name: Package Windows zip archive and SHA-256 checksum
        shell: pwsh
        run: |
          $stageDir = "dist\sttme-windows-x86_64"
          $zipFile = "dist\sttme-windows-x86_64.zip"
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          Copy-Item "target\release\sttme.exe" "$stageDir\sttme.exe" -Force
          Copy-Item "install.ps1" "$stageDir\install.ps1" -Force
          Copy-Item "uninstall.ps1" "$stageDir\uninstall.ps1" -Force
          Copy-Item "README.md" "$stageDir\README.md" -Force
          Copy-Item "LICENSE" "$stageDir\LICENSE" -Force
          Compress-Archive -Path "$stageDir\*" -DestinationPath $zipFile -Force
          $hash = (Get-FileHash -Path $zipFile -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) "dist\sttme-windows-x86_64.zip.sha256"),
            "$hash  sttme-windows-x86_64.zip`n",
            (New-Object System.Text.UTF8Encoding($false))
          )

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: sttme-windows-x86_64
          path: |
            dist/sttme-windows-x86_64.zip
            dist/sttme-windows-x86_64.zip.sha256
          if-no-files-found: error

  package-windows-installer:
    name: Package Windows Inno Setup Installer (Docker)
    needs: build-windows
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows binary artifact
        uses: actions/download-artifact@v4
        with:
          name: sttme-windows-x86_64
          path: dist/sttme-windows-x86_64

      - name: Build Inno Setup installer via Docker
        run: |
          if [[ -f dist/sttme-windows-x86_64/sttme-windows-x86_64.zip ]]; then
            unzip -o dist/sttme-windows-x86_64/sttme-windows-x86_64.zip -d dist/sttme-windows-x86_64/
          fi
          ./packaging/windows/build-installer.sh "${STTME_VERSION}"

      - name: Upload Windows setup installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: sttme-windows-setup
          path: |
            dist/sttme-windows-x86_64-setup.exe
            dist/sttme-windows-x86_64-setup.exe.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - build-linux
      - build-windows
      - package-windows-installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built Linux and Windows artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Assemble SHA256SUMS and standalone installers
        run: |
          cp install.sh release-assets/install.sh
          cp uninstall.sh release-assets/uninstall.sh
          cp install.ps1 release-assets/install.ps1
          cp uninstall.ps1 release-assets/uninstall.ps1
          chmod +x release-assets/install.sh release-assets/uninstall.sh
          (
            cd release-assets
            cat sttme-*.sha256 | sort -k2 > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/sttme-windows-x86_64-setup.exe
            release-assets/sttme-windows-x86_64.zip
            release-assets/sttme-linux-x86_64.tar.gz
            release-assets/sttme-linux-aarch64.tar.gz
            release-assets/SHA256SUMS
            release-assets/install.sh
            release-assets/uninstall.sh
            release-assets/install.ps1
            release-assets/uninstall.ps1
